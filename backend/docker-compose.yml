services:
  db_dev:
    image: mysql:8.0
    container_name: hexavara_crm_db_dev
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: crm_engine_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql

  db_prod:
    image: mysql:8.0
    container_name: hexavara_crm_db_prod
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: crm_engine_prod
    ports:
      - '3307:3306'
    volumes:
      - mysql_prod_data:/var/lib/mysql

  api:
    build: .
    container_name: hexavara_crm_api
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=mysql://root:password@db_dev:3306/crm_engine_dev
      - PORT=3000
    depends_on:
      - db_dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mysql_dev_data:
  mysql_prod_data:
